name: REA bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: rea-agents version
        required: true
        default: 6.7.0

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build bundle
        run: scripts/build-rea-bundle.sh "${{ matrix.platform }}" "${{ inputs.version }}" "$RUNNER_TEMP/out"
      - name: Smoke test
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          tar xzf "$RUNNER_TEMP/out/rea-${{ inputs.version }}-${{ matrix.platform }}.tar.gz" -C "$RUNNER_TEMP/smoke"
          test "$("$RUNNER_TEMP/smoke/rea-${{ inputs.version }}-${{ matrix.platform }}/bin/rea" --version)" = "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rea-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="tools-rea-${{ inputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "REA ${{ inputs.version }} bundles" --notes "Self-contained rea-agents ${{ inputs.version }} bundles for the Studio tools manifest."
          gh release upload "$tag" dist/*.tar.gz --clobber
      - name: Manifest values
        run: |
          cd dist
          for f in rea-*.tar.gz; do
            echo "$f $(sha256sum "$f" | cut -d' ' -f1) $(wc -c < "$f" | tr -d ' ')"
          done | tee "$GITHUB_STEP_SUMMARY"
