name: Release build
# Builds the standalone Studio tarballs (docs/building-releases.md) and checks each one boots. Build only: nothing is
# published or released. `os` is the open edition; `cloud` adds the private addons from packages/pikkustudio-private,
# checked out with the CLOUD_ADDON_DEPLOY_KEY secret, and is skipped when that secret is not set.
# release-build.sh boots every tarball on its own host; the Linux ones are booted again in a clean debian:stable-slim.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  os:
    name: os-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin/arm64
            target: darwin-arm64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            target: linux-arm64
          - runner: ubuntu-24.04
            platform: linux/x64
            target: linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: node scripts/link-addon.mjs --unlink
      - name: Build (boots before it is packed)
        env:
          RELEASE_NAME: studio-os
          RELEASE_OUT: dist-release
        run: RELEASE_VERSION="0.0.0-${GITHUB_SHA::7}" sh scripts/release-build.sh ${{ matrix.platform }}
      - name: Boot in debian:stable-slim
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist-release:/dist:ro" -v "$PWD/scripts:/scripts:ro" debian:stable-slim \
            sh /scripts/release-check.sh "/dist/$(cd dist-release && ls studio-os-*-${{ matrix.target }}.tar.gz)"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-os-${{ matrix.target }}
          path: dist-release/studio-os-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  gate:
    runs-on: ubuntu-24.04
    outputs:
      cloud: ${{ steps.secret.outputs.cloud }}
    steps:
      - id: secret
        env:
          KEY: ${{ secrets.CLOUD_ADDON_DEPLOY_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo cloud=true >> "$GITHUB_OUTPUT"
          else
            echo cloud=false >> "$GITHUB_OUTPUT"
            {
              echo '### Cloud edition skipped'
              echo 'The `CLOUD_ADDON_DEPLOY_KEY` secret is not set (or not available to this run, as for a pull request from a fork), so `packages/pikkustudio-private` cannot be checked out and only the OS edition was built.'
              echo 'See "Release builds in CI" in docs/building-releases.md to enable it.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  cloud:
    name: cloud-${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.cloud == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin/arm64
            target: darwin-arm64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            target: linux-arm64
          - runner: ubuntu-24.04
            platform: linux/x64
            target: linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CLOUD_ADDON_DEPLOY_KEY }}
      - name: Private addons
        run: git -c submodule.pikkustudio-private.update=checkout submodule update --init packages/pikkustudio-private
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: node scripts/link-addon.mjs
      - name: Build (boots before it is packed)
        env:
          RELEASE_NAME: studio
          RELEASE_OUT: dist-release
        run: RELEASE_VERSION="0.0.0-${GITHUB_SHA::7}" sh scripts/release-build.sh ${{ matrix.platform }}
      - name: Boot in debian:stable-slim
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist-release:/dist:ro" -v "$PWD/scripts:/scripts:ro" debian:stable-slim \
            sh /scripts/release-check.sh "/dist/$(cd dist-release && ls studio-*-${{ matrix.target }}.tar.gz)"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.target }}
          path: dist-release/studio-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14
