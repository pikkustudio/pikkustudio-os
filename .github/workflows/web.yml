name: Web
# Builds the web edition of Studio (scripts/build-hosted.sh, with the private addons from packages/pikkustudio-private
# checked out with the CLOUD_ADDON_DEPLOY_KEY secret) and deploys it to cloud.pikkustudio.app with wrangler.hosted.jsonc.
# It deploys on every push to main, and is skipped when CLOUD_ADDON_DEPLOY_KEY or CLOUDFLARE_API_TOKEN is not set.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.secrets.outputs.deploy }}
    steps:
      - id: secrets
        env:
          KEY: ${{ secrets.CLOUD_ADDON_DEPLOY_KEY }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$KEY" ] && [ -n "$TOKEN" ]; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          else
            echo deploy=false >> "$GITHUB_OUTPUT"
            echo '### Web deploy skipped' >> "$GITHUB_STEP_SUMMARY"
            echo 'Set the `CLOUD_ADDON_DEPLOY_KEY` and `CLOUDFLARE_API_TOKEN` secrets to build and deploy cloud.pikkustudio.app.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CLOUD_ADDON_DEPLOY_KEY }}
      - name: Private addons
        run: git -c submodule.pikkustudio-private.update=checkout submodule update --init packages/pikkustudio-private
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run build:hosted
      - name: Deploy
        working-directory: apps/studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: bunx wrangler deploy -c wrangler.hosted.jsonc
