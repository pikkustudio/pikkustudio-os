name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run check:fabric-boundary
      - run: bun run check:independence
      - run: bun run prebuild
      - run: bun run tsc
      - run: bun run test
