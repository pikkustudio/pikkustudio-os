name: Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  desktop:
    name: desktop-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            experimental: false
            bundles: appimage,deb
            paths: |
              apps/studio/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/studio/src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            target: macos
            experimental: false
            bundles: app,dmg
            paths: |
              apps/studio/src-tauri/target/release/bundle/dmg/*.dmg
              apps/studio/src-tauri/target/release/bundle/macos/*.app
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: bun install --frozen-lockfile
      - run: bun run check:cloud-boundary
      - run: bun run check:independence
      - name: Build
        shell: bash
        env:
          TAURI_BUNDLES: ${{ matrix.bundles }}
        run: bun run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.target }}-${{ github.sha }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
      - name: Upload to R2
        if: github.ref_type == 'tag' && matrix.target == 'macos'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASES_BUCKET: ${{ vars.R2_RELEASES_BUCKET }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          v="${GITHUB_REF_NAME#v}"
          dmg=$(ls apps/studio/src-tauri/target/release/bundle/dmg/*.dmg)
          aws s3 cp "$dmg" "s3://$RELEASES_BUCKET/studio-os/$v/Pikku-Studio-OS-$v-arm64.dmg"
          echo "{\"version\":\"$v\"}" > latest.json
          aws s3 cp latest.json s3://$RELEASES_BUCKET/studio-os/latest.json --content-type application/json
